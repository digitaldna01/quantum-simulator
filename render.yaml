services:
  - type: web
    name: quantum-simulator
    env: python
    buildCommand: |
      cd frontend && npm install && npm run build
      cd ../backend && pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
    buildFilter:
      paths:
        - frontend/**
        - backend/**
        - render.yaml
    plan: free
    rootDir: backend